# Tự build APK mỗi khi code thay đổi, rồi đăng lên mục Releases để tải về cài.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Khoá ký nằm trong Secrets của repo, không nằm trong code công khai.
      - name: Khôi phục khoá ký
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > lqpicker.jks
            printf 'storeFile=lqpicker.jks\nstorePassword=%s\nkeyAlias=lqpicker\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > keystore.properties
            echo "Đã khôi phục khoá ký."
          else
            echo "Không có khoá ký trong Secrets: APK sẽ ký bằng khoá debug."
          fi

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk LQPicker-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LQPicker-apk
          path: LQPicker-v1.0.${{ github.run_number }}.apk

      - name: Đăng bản phát hành
        if: github.repository == 'horizonteam2026-dev/lq-picker-claude'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LQ Picker 1.0.${{ github.run_number }}
          body: |
            Tải file .apk bên dưới về điện thoại Android và cài.
            Bản mới cài đè lên bản cũ được (cùng khoá ký).
          files: LQPicker-v1.0.${{ github.run_number }}.apk
