# Tự build APK mỗi khi code thay đổi, rồi đăng lên mục Releases để tải về cài.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Khoá ký (lqpicker.jks + keystore.properties) nằm trong repo ở dạng ĐÃ MÃ HOÁ: signing/signing.tar.enc.
      # Mật khẩu giải mã chỉ nằm trong Secrets của repo (KEYSTORE_PASSWORD), không công khai.
      - name: Khôi phục khoá ký
        id: key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Bỏ dấu cách/xuống dòng, đổi về chữ thường (bàn phím điện thoại hay tự viết hoa chữ đầu).
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          export KS_PASS
          if [ -n "$KS_PASS" ] && [ -f signing/signing.tar.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/signing.tar.enc -pass env:KS_PASS -out signing.tar; then
              tar -xf signing.tar && rm -f signing.tar
              echo "Đã khôi phục khoá ký."
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              rm -f signing.tar
              FP=$(printf '%s' "$KS_PASS" | sha256sum | cut -c1-8)
              echo "::warning::Mật khẩu KEYSTORE_PASSWORD không đúng (độ dài ${#KS_PASS}, cần 19; vân tay $FP, cần 7c371856). APK sẽ ký bằng khoá debug và KHÔNG đăng bản chính thức."
            fi
          else
            echo "Không có khoá ký trong Secrets: APK sẽ ký bằng khoá debug."
          fi

      - name: Build APK
        # Thử lại tối đa 3 lần nếu máy chủ thư viện lỗi tạm thời.
        run: |
          for i in 1 2 3; do
            gradle :app:assembleRelease --no-daemon --stacktrace && exit 0
            echo "Build lỗi, thử lại lần $((i+1)) sau 30 giây..."; sleep 30
          done
          exit 1

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk LQPicker-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LQPicker-apk
          path: LQPicker-v1.0.${{ github.run_number }}.apk

      - name: Đăng bản phát hành
        # Chỉ đăng bản chính thức khi APK được ký bằng khoá thật (để các bản sau cài đè được).
        if: steps.key.outputs.signed == 'true' && github.repository == 'horizonteam2026-dev/lq-picker-claude'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LQ Picker 1.0.${{ github.run_number }}
          body: |
            Tải file .apk bên dưới về điện thoại Android và cài.
            Bản mới cài đè lên bản cũ được (cùng khoá ký).
          files: LQPicker-v1.0.${{ github.run_number }}.apk
